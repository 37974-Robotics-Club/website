# Builds the site for every pull request, so a broken template or a YAML
# mistake shows up as a red ✗ on the pull request instead of on the live site.
# It doesn't publish anything.
name: Check build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
      TZ: America/Edmonton
    steps:
      - name: Install Hugo
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Check out
        uses: actions/checkout@v4
      - name: Build
        # --panicOnWarning turns warnings (like a missing template) into failures.
        run: hugo --gc --minify --panicOnWarning
