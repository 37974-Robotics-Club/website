# Site settings for FTC team 37974.
# Most of what you'll want to change lives under [params] below.

baseURL = "https://www.ftc37974.ca/"   # change to your real address, e.g. https://37974robotics.ca/
languageCode = "en-ca"
title = "37974 Robotics"
theme = "ver37974"
enableRobotsTXT = true
summaryLength = 30

# Members and sponsors are shown on their list pages only, with no page each.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "always"
  [cascade.target]
    kind = "page"
    path = "{/members/**,/sponsors/**}"

[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 9

[markup.goldmark.renderer]
  unsafe = true   # lets the web editor's embeds and simple HTML through

[markup.highlight]
  style = "nord"

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  # Shown in the header, footer and page titles.
  teamNumber = "37974"
  teamName = "37974 Robotics"
  legalName = "37974 Robotics Club"
  city = "Edmonton, Alberta"
  description = "FIRST Tech Challenge team 37974: a student-run youth robotics club in Edmonton, Alberta."

  # Contact. Leave a value empty ("") to hide it.
  email = "info@ftc37974.ca"
  sponsorEmail = "sponsors@example.org"

  # Contact forms. A static site can't receive form posts by itself, so forms
  # are sent through a form service. Paste a Formspree (or similar) endpoint
  # here, e.g. "https://formspree.io/f/abcdwxyz". If it's empty, the form is
  # replaced with an email link.
  formAction = ""

  # The Club is a not-for-profit corporation. Set to true only if it becomes a
  # registered charity with the CRA; this changes the tax wording on the
  # sponsorship page.
  registeredCharity = false

  # Where the current season's engineering portfolio PDF lives (optional).
  portfolioPDF = ""

  [params.social]
    instagram = "https://www.instagram.com/ftc37974/"
    youtube = "https://www.youtube.com/"
    tiktok = ""
    github = "https://github.com/37974-Robotics-Club"
    ftcScout = "https://ftcscout.org/teams/37974"

